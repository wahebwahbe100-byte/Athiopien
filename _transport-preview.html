<!doctype html>
<meta charset="utf-8">
<style>
body{font-family:Arial,sans-serif;margin:30px;background:#fff;color:#71818b}
.row{width:440px;border-top:1px solid #dfe5df;border-bottom:1px solid #dfe5df;padding:16px 0;display:grid;grid-template-columns:150px 1fr;align-items:center}
.label{font-weight:700;font-size:14px}
.icons{display:flex;gap:10px}
.ico{display:grid;place-items:center;width:44px;height:42px;border-radius:14px;background:#eef3f7}
.ico img{width:25px;height:25px;object-fit:contain}
</style>
<div class="row">
  <div class="label">Transport</div>
  <div class="icons">
    <span class="ico"><img src="icon-airplane.png"></span>
    <span class="ico"><img src="icon-car.png"></span>
    <span class="ico"><img src="icon-bus.png"></span>
  </div>
</div>

<script src="aj-mega-menu.js?v=17"></script>


<style id="aj-header-flag-only-v1">
/* Header language control: show only the flag, with no visible layer behind it. */
.site-nav .nav-actions .langbtn,
.site-nav:not(.scrolled) .nav-actions .langbtn,
.site-nav.scrolled .nav-actions .langbtn,
body.top-strip-collapsed .site-nav .nav-actions .langbtn{
  width:44px!important;
  min-width:44px!important;
  height:44px!important;
  min-height:44px!important;
  padding:0!important;
  margin:0!important;
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  background:transparent!important;
  border:0!important;
  border-radius:0!important;
  box-shadow:none!important;
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
  color:inherit!important;
}
.site-nav .nav-actions .langbtn:hover,
.site-nav .nav-actions .langbtn:active,
.site-nav .nav-actions .langbtn[aria-expanded="true"]{
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
}
.site-nav .nav-actions .langbtn>span,
.site-nav .nav-actions .langbtn>.ui-icon,
.site-nav .nav-actions .langbtn>svg{
  display:none!important;
}
.site-nav .nav-actions .langbtn>img,
.site-nav .nav-actions .langbtn .aj-flag-img,
.site-nav .nav-actions .langbtn .aj-flag-pair img{
  border:0!important;
  box-shadow:none!important;
  outline:0!important;
  background:transparent!important;
}
.site-nav .nav-actions .langbtn .aj-flag-pair{
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
}
@media (max-width:768px){
  .site-nav .nav-actions .langbtn,
  .site-nav:not(.scrolled) .nav-actions .langbtn,
  .site-nav.scrolled .nav-actions .langbtn,
  body.top-strip-collapsed .site-nav .nav-actions .langbtn{
    width:42px!important;
    min-width:42px!important;
    height:42px!important;
    min-height:42px!important;
    padding:0!important;
    background:transparent!important;
    border:0!important;
    border-radius:0!important;
    box-shadow:none!important;
    backdrop-filter:none!important;
    -webkit-backdrop-filter:none!important;
  }
}
</style>
