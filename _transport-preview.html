<!doctype html>
<meta charset="utf-8">
<style>
body{font-family:Arial,sans-serif;margin:30px;background:#fff;color:#71818b}
.row{width:440px;border-top:1px solid #dfe5df;border-bottom:1px solid #dfe5df;padding:16px 0;display:grid;grid-template-columns:150px 1fr;align-items:center}
.label{font-weight:700;font-size:14px}
.icons{display:flex;gap:10px}
.ico{display:grid;place-items:center;width:44px;height:42px;border-radius:14px;background:#eef3f7}
.ico img{width:25px;height:25px;object-fit:contain}
</style>
<div class="row">
  <div class="label">Transport</div>
  <div class="icons">
    <span class="ico"><img src="icon-airplane.png"></span>
    <span class="ico"><img src="icon-car.png"></span>
    <span class="ico"><img src="icon-bus.png"></span>
  </div>
</div>
